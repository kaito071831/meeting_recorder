[project]
name = "meeting-recorder"
version = "0.1.0"
description = "オンライン会議を録音→文字起こし→議事録生成するローカル Web アプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "anthropic>=0.116",
    "ollama>=0.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "resemblyzer>=0.1.4",
    "scikit-learn>=1.9",
    # cross-platform に利用可能 RAM を取得しハード自動調整（モデル/batch/
    # スレッド）に使う。
    "psutil>=5.9",
    "torch>=2.13,<3",
    # torch が setuptools を無制約で要求するため 83.0.0 系に解決されがちだが、
    # webrtcvad（resemblyzer の依存）が実行時に pkg_resources を import する。
    # pkg_resources は setuptools 81 以降のデフォルト配布から外れたため、
    # まだ同梱している最終系列にピン留めする。
    "setuptools<81",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
